<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurosecond Dashboard</title>
  <link rel="icon" type="image/jpeg" href="../image/auro.jpeg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Flatpickr Library CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Komponen Kustom -->
  <link rel="stylesheet" href="../components/calendar.css" />
  <script src="../components/confirm-modal.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen p-4 md:p-8">
  <div id="globalLoader" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center gap-3">
    <div class="animate-spin h-10 w-10 border-4 border-blue-600 border-t-transparent rounded-full"></div>
    <p class="text-sm font-bold text-gray-600">Loading...</p>
  </div>

  <div id="pageBeranda" class="max-w-5xl mx-auto hidden">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-200 pb-4 mb-6 gap-4">
      <div class="flex items-center gap-4">
        <!-- <img src="../image/auro.jpeg" alt="" class="w-10 h-10" /> -->
        <div>
          <h1 class="text-3xl font-extrabold text-blue-600">Auro Second Dashboard</h1>
          <p class="text-sm text-gray-500">Data tersinkronisasi langsung secara realtime antar perangkat</p>
        </div>
      </div>
      <div class="flex gap-2 w-full sm:w-auto flex-wrap sm:flex-nowrap">
        <a id="btnOmsetPage" href="../omset-page/omset.html"
          class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold text-sm px-3 py-2.5 rounded-lg shadow-sm transition cursor-pointer flex items-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-chart-line"></i> Grafik & Omset
        </a>
        <a id="btnBukaSpreadsheet" href="#" target="_blank"
          class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-bold text-sm px-3 py-2.5 rounded-lg shadow-sm transition cursor-pointer flex items-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-table"></i> Google Sheets
        </a>
        <button onclick="tarikDataDariSheet()"
          class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-sm px-3 py-2.5 rounded-lg shadow-sm cursor-pointer whitespace-nowrap flex items-center gap-2">
          <i class="fa-solid fa-arrows-rotate"></i> Refresh
        </button>
        <button onclick="bukaModalTambah()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-4 py-2.5 rounded-lg shadow transition cursor-pointer whitespace-nowrap flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Tambah Unit
        </button>
      </div>
    </div>

    <!-- Tombol Filter Pencarian (Hanya muncul di Mobile/HP) -->
    <button onclick="toggleFilter()"
      class="w-full bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 font-bold text-sm px-4 py-3 rounded-xl shadow-sm cursor-pointer mb-4 flex items-center justify-between sm:hidden transition-all duration-200">
      <span class="flex items-center gap-2 text-blue-600">
        <i class="fa-solid fa-sliders text-sm"></i> Filter Pencarian
      </span>
      <svg id="arrowFilter" class="w-4 h-4 text-gray-500 transition-transform duration-200" fill="none"
        stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
      </svg>
    </button>

    <!-- Container Grid Filter (Tersembunyi di HP secara default, selalu muncul di Desktop) -->
    <div id="containerFilter" class="hidden sm:grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div>
        <label for="filterNamaMotor" class="block text-xs font-bold text-gray-500 uppercase mb-1">Nama Motor</label>
        <input type="text" id="filterNamaMotor" placeholder="Cari nama motor..."
          class="w-full bg-white border border-gray-300 rounded-lg p-2 text-sm focus:outline-none font-medium"
          oninput="renderBeranda()" />
      </div>
      <div>
        <label for="filterBulan" class="block text-xs font-bold text-gray-500 uppercase mb-1">Bulan</label>
        <select id="filterBulan"
          class="w-full bg-white border border-gray-300 rounded-lg p-2 text-sm focus:outline-none"
          onchange="renderBeranda()">
          <option value="">Semua Bulan</option>
          <option value="12">Desember</option>
          <option value="11">November</option>
          <option value="10">Oktober</option>
          <option value="9">September</option>
          <option value="8">Agustus</option>
          <option value="7">Juli</option>
          <option value="6">Juni</option>
          <option value="5">Mei</option>
          <option value="4">April</option>
          <option value="3">Maret</option>
          <option value="2">Februari</option>
          <option value="1">Januari</option>
        </select>
      </div>
      <div>
        <label for="filterTahun" class="block text-xs font-bold text-gray-500 uppercase mb-1">Tahun</label>
        <select id="filterTahun"
          class="w-full bg-white border border-gray-300 rounded-lg p-2 text-sm focus:outline-none"
          onchange="renderBeranda()">
          <option value="">Semua Tahun</option>
        </select>
      </div>
      <div>
        <label for="filterStatus" class="block text-xs font-bold text-gray-500 uppercase mb-1">Status Unit</label>
        <select id="filterStatus"
          class="w-full bg-white border border-gray-300 rounded-lg p-2 text-sm focus:outline-none"
          onchange="renderBeranda()">
          <option value="">Semua Status</option>
          <option value="Ready">Ready</option>
          <option value="Terjual">Terjual</option>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm text-center">
        <span class="block text-xs font-bold text-gray-400 uppercase">Total Unit</span>
        <span id="countTotal" class="text-2xl font-bold text-gray-800">0</span>
      </div>
      <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm text-center">
        <span class="block text-xs font-bold text-blue-500 uppercase">Ready</span>
        <span id="countReady" class="text-2xl font-bold text-blue-600">0</span>
      </div>
      <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm text-center">
        <span class="block text-xs font-bold text-emerald-500 uppercase">Terjual</span>
        <span id="countTerjual" class="text-2xl font-bold text-emerald-600">0</span>
      </div>
    </div>

    <!-- Card Pembungkus Daftar Unit Motor -->
    <div class="bg-white border border-gray-200 rounded-2xl p-6 shadow-sm mb-8">
      <div class="flex justify-between items-center mb-5">
        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
         Daftar Unit Motor
        </h2>
      </div>
      <div id="gridMotor" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </div>

  <!-- Modal Tambah Unit -->
  <div id="modalTambah" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4">➕ Daftarkan Unit Baru</h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nama Motor</label>
          <input type="text" id="modalInputNama" placeholder="Contoh: Scoopy 2020"
            class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none font-medium" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tanggal Beli</label>
          <input type="text" id="modalInputTglBeli" placeholder="Pilih tanggal..."
            class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none font-medium cursor-pointer" />
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button onclick="tutupModalTambah()"
          class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-xs px-4 py-2 rounded-lg cursor-pointer">Batal</button>
        <button onclick="prosesTambahMotor()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded-lg cursor-pointer">Simpan Unit</button>
      </div>
    </div>
  </div>

  <!-- Toast Synchronization -->
  <div id="customToast"
    class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 ease-out flex items-center gap-3 bg-slate-900 border border-slate-850 text-white px-5 py-3.5 rounded-xl shadow-2xl max-w-sm">
    <div class="flex items-center justify-center h-8 w-8 bg-emerald-500 text-white rounded-full flex-shrink-0">
      <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <div>
      <p class="text-xs font-extrabold tracking-wider uppercase text-emerald-400">Auto Second Sync</p>
      <p id="toastMessage" class="text-sm font-medium text-slate-300">Data berhasil disinkronkan!</p>
    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../shared.js"></script>
  <script src="home.js"></script>
</body>

</html>
