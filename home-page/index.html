<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurosecond Dashboard</title>
  <link rel="icon" type="image/jpeg" href="../image/auro.jpeg" />
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Auro Second" />
  <link rel="apple-touch-icon" href="../image/auro.jpeg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Flatpickr Library CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <!-- Komponen Kustom -->
  <link rel="stylesheet" href="../components/calendar.css" />
  <script src="../components/confirm-modal.js"></script>
</head>

<body class="bg-gray-50 text-gray-800 min-h-screen p-4 md:p-8">
  <div id="globalLoader" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center gap-3">
    <svg class="animate-spin h-9 w-9 text-blue-600" viewBox="0 0 100 100" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
      <path d="M 50 10 A 40 40 0 0 0 31.92 85.68 A 36.57 36.57 0 0 1 50 21.22 Z"/>
      <path d="M 50 90 A 40 40 0 0 0 68.08 14.32 A 36.57 36.57 0 0 1 50 78.78 Z"/>
    </svg>
    <p class="text-xs font-bold text-gray-600 tracking-wide">Loading...</p>
  </div>

  <div id="pageBeranda" class="max-w-5xl mx-auto hidden">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-gray-200 pb-4 mb-6 gap-4">
      <div class="flex items-center gap-4">
        <!-- <img src="../image/auro.jpeg" alt="" class="w-10 h-10" /> -->
        <div>
          <h1 class="text-3xl font-extrabold text-blue-600">Auro Second Dashboard</h1>
          <p class="text-sm text-gray-500">Data tersinkronisasi langsung secara realtime antar perangkat</p>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:flex gap-2 w-full sm:w-auto">
        <a id="btnOmsetPage" href="omset-page/omset.html"
          class="bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold text-sm px-3.5 py-2.5 rounded-lg shadow-sm transition cursor-pointer flex items-center justify-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-chart-line"></i> Grafik & Omset
        </a>
        <a id="btnSaldoModal" href="saldo-modal/saldo-modal.html"
          class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-sm px-3.5 py-2.5 rounded-lg shadow-sm transition cursor-pointer flex items-center justify-center gap-2 whitespace-nowrap">
          <i class="fa-solid fa-wallet"></i> Saldo Modal
        </a>
      </div>
    </div>

    <!-- State Status Filter Aktif -->
    <input type="hidden" id="filterStatus" value="Ready" />

    <!-- Filter Bar Terpadu: Tab Bar Status + Filter Waktu Kompak -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 sm:gap-3 mb-4 sm:mb-5">
      <!-- 1. Tab Bar Status Unit (All, Ready, Terjual) -->
      <div class="bg-gray-100/90 p-1 rounded-xl flex items-center gap-1 shadow-inner border border-gray-200/60 w-full sm:w-auto">
        <button type="button" id="tabStatusAll" onclick="setFilterStatus('')"
          class="flex-1 sm:flex-none py-1.5 px-3.5 text-xs sm:text-sm rounded-lg transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer text-gray-500 hover:text-gray-800 font-medium hover:bg-gray-200/50">
          <span>All</span>
          <span id="countTotal" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-gray-200 text-gray-600">0</span>
        </button>
        <button type="button" id="tabStatusReady" onclick="setFilterStatus('Ready')"
          class="flex-1 sm:flex-none py-1.5 px-3.5 text-xs sm:text-sm rounded-lg transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer bg-white text-blue-600 font-bold shadow-sm">
          <span>Ready</span>
          <span id="countReady" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-blue-100 text-blue-700">0</span>
        </button>
        <button type="button" id="tabStatusTerjual" onclick="setFilterStatus('Terjual')"
          class="flex-1 sm:flex-none py-1.5 px-3.5 text-xs sm:text-sm rounded-lg transition-all duration-150 flex items-center justify-center gap-1.5 cursor-pointer text-gray-500 hover:text-gray-800 font-medium hover:bg-gray-200/50">
          <span>Terjual</span>
          <span id="countTerjual" class="px-1.5 py-0.5 text-[10px] font-bold rounded-full bg-gray-200 text-gray-600">0</span>
        </button>
      </div>

      <!-- 2. Filter Waktu (Bulan & Tahun) Kompak Tanpa Makan Space -->
      <div class="flex items-center gap-2 w-full sm:w-auto">
        <div class="flex-1 sm:w-44">
          <select id="filterBulan"
            class="w-full bg-white border border-gray-200 rounded-lg py-1.5 px-2.5 text-xs font-semibold text-gray-700 focus:outline-none focus:border-blue-500 shadow-sm cursor-pointer"
            onchange="renderBeranda()">
          </select>
        </div>
        <div class="w-36 sm:w-40">
          <select id="filterTahun"
            class="w-full bg-white border border-gray-200 rounded-lg py-1.5 px-2.5 text-xs font-semibold text-gray-700 focus:outline-none focus:border-blue-500 shadow-sm cursor-pointer"
            onchange="renderBeranda()">
          </select>
        </div>
      </div>
    </div>

    <!-- Card Pembungkus Daftar Unit Motor -->
    <div class="bg-white border border-gray-200 rounded-2xl p-4 sm:p-6 shadow-sm mb-8">
      <div class="flex justify-between items-center mb-5 gap-3">
        <h2 class="text-base sm:text-lg font-bold text-gray-800 flex items-center gap-2">
          Daftar Unit Motor
        </h2>
        <button onclick="bukaModalTambah()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs sm:text-sm px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-lg shadow-sm hover:shadow transition cursor-pointer whitespace-nowrap flex items-center gap-1.5 sm:gap-2">
          <i class="fa-solid fa-plus text-xs sm:text-sm"></i> Tambah Unit
        </button>
      </div>
      <div id="gridMotor" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>
  </div>

  <!-- Modal Tambah Unit -->
  <div id="modalTambah" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-2xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-blue-600"></i> Daftarkan Unit Baru
      </h3>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Nama Motor</label>
          <input type="text" id="modalInputNama" placeholder="Contoh: Scoopy 2020"
            class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none font-medium" />
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Tanggal Beli</label>
          <input type="text" id="modalInputTglBeli" placeholder="Pilih tanggal..."
            class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-sm focus:outline-none font-medium cursor-pointer" />
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button onclick="tutupModalTambah()"
          class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold text-xs px-4 py-2 rounded-lg cursor-pointer">Batal</button>
        <button onclick="prosesTambahMotor()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded-lg cursor-pointer">Simpan Unit</button>
      </div>
    </div>
  </div>

  <!-- Toast Synchronization -->
  <div id="customToast"
    class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 ease-out flex items-center gap-3 bg-slate-900 border border-slate-850 text-white px-5 py-3.5 rounded-xl shadow-2xl max-w-sm">
    <div class="flex items-center justify-center h-8 w-8 bg-emerald-500 text-white rounded-full flex-shrink-0">
      <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <div>
      <p class="text-xs font-extrabold tracking-wider uppercase text-emerald-400">Auto Second Sync</p>
      <p id="toastMessage" class="text-sm font-medium text-slate-300">Data berhasil disinkronkan!</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="../shared.js"></script>
  <script src="../components/custom-select.js"></script>
  <script src="home.js"></script>
</body>

</html>
