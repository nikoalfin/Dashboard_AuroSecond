<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurosecond - Catatan Saldo Modal</title>
  <link rel="icon" type="image/jpeg" href="../../image/auro.jpeg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="../../components/app-header.js"></script>
  <script src="../../components/confirm-modal.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen">
  <!-- Global Loader -->
  <div id="globalLoader" class="fixed inset-0 bg-white/80 z-50 flex flex-col items-center justify-center gap-3">
    <div class="animate-spin h-10 w-10 border-4 border-blue-600 border-t-transparent rounded-full"></div>
    <p class="text-sm font-bold text-gray-600">Memuat data saldo modal...</p>
  </div>

  <!-- Reusable Sticky Header Component -->
  <app-header 
    back-text="Kembali ke dashboard" 
    back-url="../index.html" 
    title="Pencatatan Saldo Modal" 
    max-width="max-w-4xl">
  </app-header>

  <div class="max-w-4xl mx-auto px-3 sm:px-6 md:px-8 pb-12">
    <!-- Title Section -->
    <div class="border-b border-gray-200 pb-3 sm:pb-4 mb-4 sm:mb-6">
      <h1 class="text-xl sm:text-3xl font-extrabold text-blue-600 flex items-center gap-2 sm:gap-2.5">
        <i class="fa-solid fa-wallet text-emerald-600"></i> Catatan Saldo Modal
      </h1>
      <p class="text-[11px] sm:text-sm text-gray-500 mt-1">Pencatatan rincian sumber dana modal dari seluruh pemodal</p>
    </div>

    <!-- Ringkasan Total Saldo Card -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 mb-4 sm:mb-6">
      <div class="bg-white border border-gray-200 rounded-xl sm:rounded-2xl p-3.5 sm:p-5 shadow-sm flex items-center gap-3 sm:gap-4">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-lg sm:text-xl shrink-0">
          <i class="fa-solid fa-money-bill-wave"></i>
        </div>
        <div>
          <span class="block text-[11px] sm:text-xs font-bold text-gray-400 uppercase tracking-wider">Total Saldo Modal</span>
          <span id="totalSaldoTeks" class="text-lg sm:text-2xl font-black text-gray-800">Rp 0</span>
        </div>
      </div>
      <div class="bg-white border border-gray-200 rounded-xl sm:rounded-2xl p-3.5 sm:p-5 shadow-sm flex items-center gap-3 sm:gap-4">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-lg sm:text-xl shrink-0">
          <i class="fa-solid fa-users"></i>
        </div>
        <div>
          <span class="block text-[11px] sm:text-xs font-bold text-gray-400 uppercase tracking-wider">Jumlah Sumber Dana</span>
          <span id="totalSumberTeks" class="text-lg sm:text-2xl font-black text-blue-600">0 Sumber</span>
        </div>
      </div>
    </div>

    <!-- Table Card Pencatatan -->
    <div class="bg-white rounded-xl shadow-xl p-6 border border-gray-200">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-base font-bold text-gray-700">Rincian Sumber Modal</h2>
        <button onclick="tambahBaris()"
          class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-3 py-2 rounded-lg cursor-pointer flex items-center gap-1.5">
          <i class="fa-solid fa-plus text-xs"></i> Tambah Sumber
        </button>
      </div>

      <!-- Tabel (Sama persis dengan tabel detail) -->
      <div class="overflow-x-auto border border-gray-200 rounded-lg">
        <table class="w-full min-w-[420px] text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-xs uppercase font-bold border-b border-gray-200">
              <th class="p-3 w-12 text-center hidden sm:table-cell">No</th>
              <th class="p-3">Keterangan</th>
              <th class="p-3 w-32 sm:w-40 text-left">Jumlah (Rp)</th>
              <th class="p-3 w-16 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="tbodySaldoModal" class="divide-y divide-gray-100 bg-white">
            <!-- Diisi secara dinamis oleh JS -->
          </tbody>
        </table>
      </div>

      <!-- Action Footer -->
      <div class="mt-4 sm:mt-6 flex justify-end items-center pt-3 sm:pt-4 border-t border-gray-100">
        <button onclick="simpanSaldoModal()" id="btnSimpan"
          class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-6 py-2.5 rounded-xl shadow transition cursor-pointer flex items-center justify-center gap-2">
          <i class="fa-solid fa-floppy-disk"></i> Simpan Perubahan
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Synchronization -->
  <div id="customToast"
    class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 ease-out flex items-center gap-3 bg-slate-900 border border-slate-800 text-white px-5 py-3.5 rounded-xl shadow-2xl max-w-sm">
    <div class="flex items-center justify-center h-8 w-8 bg-emerald-500 text-white rounded-full flex-shrink-0">
      <svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    <div>
      <p class="text-xs font-extrabold tracking-wider uppercase text-emerald-400">Auro Second Sync</p>
      <p id="toastMessage" class="text-sm font-medium text-slate-300">Data berhasil disinkronkan!</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../config.js"></script>
  <script src="../../shared.js"></script>
  <script src="saldo-modal.js"></script>
</body>
</html>
